# Project overrides on top of detekt's default ruleset (buildUponDefaultConfig = true).
# Formatting is kotlinter's job and is not configured here.
# See STYLE_GUIDE.md for the conventions these rules enforce.

complexity:
  CyclomaticComplexMethod:
    # A `when` over VaultError has a branch per case because it has no else branch, which is what
    # fails the build when a case is added. A branch that is one expression is not a path to test.
    ignoreSimpleWhenEntries: true
  LongMethod:
    # Composables and the vault write path are legitimately long and linear.
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    # VaultSession owns the data key, and §8.4's lend and exclusion run across every operation that
    # reaches one, so each such operation is a member. A second class over the same key would be a
    # second owner of it, which is what that exclusion exists to prevent, so this count follows what
    # the vault can be asked to do rather than the class doing more than one thing.
    allowedFunctionsPerClass: 21
    ignorePrivate: true
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    # STYLE_GUIDE.md, error handling: JDK exceptions are caught at the boundary and converted
    # to a VaultError. Catching broadly is correct there, but must be deliberate.
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # STYLE_GUIDE.md, naming: platform source sets use the source-set suffix, so
    # Platform.jvm.kt holds JvmPlatform. detekt's default list omits 'jvm'.
    # Upstream PR detekt/detekt#9438 expands these defaults; drop this override once
    # it ships in a release we depend on.
    multiplatformTargets:
      - 'jvm'
      - 'ios'
      - 'android'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

style:
  ForbiddenImport:
    # Salts, nonces, keys and identifiers are drawn from SecureRandom. kotlin.random.Random
    # is a seeded generator whose output is predictable from a handful of draws, and it
    # passes every test that only asks for bytes of the right length. The invariant is
    # stated over the two packages, so every source set holding them is included, tests
    # among them.
    active: true
    includes:
      - '**/src/*/kotlin/com/panda/tauth/crypto/**'
      - '**/src/*/kotlin/com/panda/tauth/vault/**'
    forbiddenImports:
      - value: 'kotlin.random.*'
        reason: 'crypto and vault draw randomness from SecureRandom alone'
  MagicNumber:
    # STYLE_GUIDE.md, naming: cryptographic sizes are named constants.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreNumbers: ['-1', '0', '1', '2']
  MaxLineLength:
    # kotlinter enforces the 120-column limit; detekt must not double-report it.
    active: false
  ForbiddenComment:
    # A bare TODO is noise; a TODO naming its blocker is fine.
    active: false
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  UnusedImport:
    # A dead import is failed by ktlint's no-unused-imports in .editorconfig; this rule
    # needs the type resolution detekt does not run here (STYLE_GUIDE.md, formatting).
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    # STYLE_GUIDE.md, nullability: !! does not appear outside tests.
    active: true
  LateinitUsage:
    active: true
